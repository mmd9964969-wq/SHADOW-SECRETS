      class MysteryGame {
        constructor() {
          this.canvas = document.getElementById("gl-canvas");
          this.sound = new SoundEngine();
          this.lighting = new LightingEngine(this.canvas);
          this.renderer = new PixelRenderer();

          this.keys = new Set();
          this.mouseWorld = { x: 260, y: 170 };
          this.lastTime = performance.now();
          this.elapsed = 0;

          this.dom = {
            stage: document.getElementById("game-stage"),
            chapterLabel: document.getElementById("chapter-label"),
            objCounter: document.getElementById("obj-counter"),
            objItems: document.querySelectorAll(".obj-item"),
            prompts: document.getElementById("world-prompts"),
            dialoguePanel: document.getElementById("dialogue-panel"),
            thoughtTail: document.getElementById("thought-tail"),
            dialogueSpeaker: document.getElementById("dialogue-speaker"),
            dialogueText: document.getElementById("dialogue-text"),
            dialogueChoices: document.getElementById("dialogue-choices"),
            dialogueHint: document.getElementById("dialogue-action-hint"),
            invSlots: document.getElementById("inventory-slots"),
            toast: document.getElementById("toast-banner"),
            curtain: document.getElementById("transition-curtain"),
            curtainText: document.getElementById("transition-text"),
            epilogue: document.getElementById("epilogue-modal"),
            epilogueSummary: document.getElementById("epilogue-summary"),
            epilogueClues: document.getElementById("epilogue-clues"),
            audioBtn: document.getElementById("audio-btn"),
            restartBtn: document.getElementById("restart-btn")
          };

          this.resetGame();
          this.sound.updateButtonUI();
          this.bindEvents();
          requestAnimationFrame((t) => this.loop(t));
        }

        resetGame() {
          this.state = {
            chapter: 1,
            transitioning: false,
            activeHotspot: null,
            catAlert: false,
            catChecked: false,
            detective: {
              x: 56,
              y: GROUND_Y,
              vx: 0,
              facing: 1,
              aimAngle: -0.15,
              anim: "idle",
              frame: 0,
              walkPhase: 0,
              lastStepFrame: -1,
              flashOriginX: 64,
              flashOriginY: GROUND_Y - 17
            },
            flags: {
              printsChecked: false,
              catChecked: false,
              hasKeycard: false,
              doorUnlocked: false,
              caseClosed: false
            },
            objectives: {
              obj1: false,
              obj2: false,
              obj3: false
            },
            inventory: []
          };

          this.dialogue = {
            open: false,
            fullText: "",
            visibleChars: 0,
            typing: false,
            choices: null,
            target: "detective",
            autoCloseTimer: 0
          };

          this.dom.epilogue.classList.remove("show");
          this.closeDialogue();
          this.updateHUD();

          // Short punchy opening thought bubble above Mani's head
          this.openDialogue({
            speaker: "کارآگاه مانی",
            text: "برف همه ردها رو می‌شوره... از نوار پلیس شروع کنم.",
            autoClose: 5.5
          });
        }

        bindEvents() {
          const unlockAudio = () => this.sound.init();

          window.addEventListener("keydown", (e) => {
            unlockAudio();
            const code = e.code;
            this.keys.add(code);

            if (code === "KeyE" || code === "Space" || code === "Enter") {
              if (this.dialogue.open) {
                if (this.dialogue.typing) {
                  this.finishTyping();
                } else if (!this.dialogue.choices || this.dialogue.choices.length === 0) {
                  this.closeDialogue();
                } else if (code === "KeyE" && this.state.activeHotspot) {
                  // Allow E to close passive dialogue or re-inspect
                }
                if (code === "Space") e.preventDefault();
                return;
              }
              if (code === "KeyE" && this.state.activeHotspot) {
                this.interactWith(this.state.activeHotspot);
              }
            }

            if (this.dialogue.open && this.dialogue.choices && !this.dialogue.typing) {
              if (code === "Digit1" || code === "Numpad1") {
                this.selectChoice(0);
              } else if (code === "Digit2" || code === "Numpad2") {
                this.selectChoice(1);
              }
            }
          });

          window.addEventListener("keyup", (e) => {
            this.keys.delete(e.code);
          });

          this.canvas.addEventListener("mousemove", (e) => {
            const rect = this.canvas.getBoundingClientRect();
            this.mouseWorld.x = ((e.clientX - rect.left) / rect.width) * WORLD_W;
            this.mouseWorld.y = ((e.clientY - rect.top) / rect.height) * WORLD_H;
          });

          this.canvas.addEventListener("mousedown", (e) => {
            unlockAudio();
            if (e.button !== 0) return;

            const rect = this.canvas.getBoundingClientRect();
            const wx = ((e.clientX - rect.left) / rect.width) * WORLD_W;
            const wy = ((e.clientY - rect.top) / rect.height) * WORLD_H;
            this.mouseWorld.x = wx;
            this.mouseWorld.y = wy;

            // Check if player clicked on a nearby highlighted hotspot
            const hotspots = getChapterHotspots(this.state.chapter, this.state.flags);
            for (const h of hotspots) {
              const insideBox = Math.abs(wx - h.x) <= h.w * 0.65 && Math.abs(wy - h.y) <= h.h * 0.65;
              const inRange = Math.abs(this.state.detective.x - h.x) <= h.range + 16;
              if (insideBox && inRange) {
                this.interactWith(h);
                return;
              }
            }
          });

          this.dom.dialogueText.addEventListener("click", () => {
            unlockAudio();
            if (!this.dialogue.open) return;
            if (this.dialogue.typing) {
              this.finishTyping();
            } else if (!this.dialogue.choices || this.dialogue.choices.length === 0) {
              this.closeDialogue();
            }
          });

          this.dom.dialogueHint.addEventListener("click", () => {
            if (this.dialogue.typing) this.finishTyping();
            else if (!this.dialogue.choices || this.dialogue.choices.length === 0) this.closeDialogue();
          });

          this.dom.audioBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            this.sound.toggleMute();
          });

          this.dom.restartBtn.addEventListener("click", () => {
            this.resetGame();
          });
        }

        openDialogue(node) {
          if (!node) return;
          this.dialogue.open = true;
          this.dialogue.fullText = node.text;
          this.dialogue.visibleChars = 0;
          this.dialogue.typing = true;
          this.dialogue.choices = node.choices || null;
          this.dialogue.target = node.target || "detective";
          this.dialogue.autoCloseTimer = node.autoClose || 0;

          this.dom.dialogueSpeaker.textContent = node.speaker || "کارآگاه مانی";
          this.dom.dialogueText.textContent = "";
          this.dom.dialogueChoices.innerHTML = "";
          this.dom.dialogueHint.textContent = "...";
          this.dom.dialoguePanel.classList.add("open");
          this.updateThoughtBubblePosition();
        }

        updateThoughtBubblePosition() {
          if (!this.dialogue.open) return;
          const det = this.state.detective;
          let wx = det.x;
          let wy = det.y - 40;
          if (this.dialogue.target === "cat" && this.state.chapter === 1) {
            wx = (this.state.flags.catChecked ? 302 : 284) + 3;
            wy = 104;
          }

          const stageW = this.dom.stage.clientWidth || 960;
          const stageH = this.dom.stage.clientHeight || 540;
          const bubbleW = Math.max(155, this.dom.dialoguePanel.offsetWidth || 220);

          const rawPxX = (wx / WORLD_W) * stageW;
          const margin = bubbleW * 0.5 + 14;
          const clampedPxX = Math.max(margin, Math.min(stageW - margin, rawPxX));
          const tailOffset = Math.max(-bubbleW * 0.36, Math.min(bubbleW * 0.36, rawPxX - clampedPxX));

          const topPx = Math.max(120, (wy / WORLD_H) * stageH - 22);
          this.dom.dialoguePanel.style.left = `${clampedPxX.toFixed(1)}px`;
          this.dom.dialoguePanel.style.top = `${topPx.toFixed(1)}px`;
          if (this.dom.thoughtTail) {
            this.dom.thoughtTail.style.transform = `translateX(calc(-50% + ${tailOffset.toFixed(1)}px))`;
          }
        }

        finishTyping() {
          this.dialogue.visibleChars = this.dialogue.fullText.length;
          this.dialogue.typing = false;
          this.dom.dialogueText.textContent = this.dialogue.fullText;
          this.renderDialogueChoices();
          this.updateThoughtBubblePosition();
        }

        renderDialogueChoices() {
          this.dom.dialogueChoices.innerHTML = "";
          if (this.dialogue.choices && this.dialogue.choices.length > 0) {
            this.dom.dialogueHint.textContent = "[۱ یا ۲]";
            this.dialogue.choices.forEach((ch, idx) => {
              const btn = document.createElement("button");
              btn.type = "button";
              btn.className = "choice-btn";
              btn.innerHTML = `<span class="choice-num">${idx === 0 ? "۱." : "۲."}</span><span>${ch.text}</span>`;
              btn.addEventListener("click", () => this.selectChoice(idx));
              this.dom.dialogueChoices.appendChild(btn);
            });
          } else {
            this.dom.dialogueHint.textContent = "[Space] ×";
          }
        }

        selectChoice(index) {
          if (!this.dialogue.choices || !this.dialogue.choices[index]) return;
          const choice = this.dialogue.choices[index];
          const nextNode = choice.action ? choice.action() : null;
          if (nextNode) {
            this.openDialogue(nextNode);
          } else {
            this.closeDialogue();
          }
        }

        closeDialogue() {
          this.dialogue.open = false;
          this.dialogue.typing = false;
          this.dialogue.choices = null;
          this.dom.dialoguePanel.classList.remove("open");
        }

        interactWith(hotspot) {
          this.state.detective.anim = "inspect";
          this.state.detective.facing = hotspot.x >= this.state.detective.x ? 1 : -1;
          const script = buildDialogueScript(hotspot.id, this);
          if (script) this.openDialogue(script);
        }

        triggerDoorReveal(checkedLockFirst = false) {
          this.state.flags.doorUnlocked = true;
          this.sound.playDoorUnlock();
          this.showToast("قفل الکترونیکی مغازه باز شد!");

          const prefix = checkedLockFirst
            ? "قفل خط و خش نداره؛ با کارت دوم اومدن تو. "
            : "";

          return {
            speaker: "کشف نهایی",
            text: prefix + "ضبط‌صوت رو ساعت ۱۲ ایستاده! ساعت‌ساز صحنه‌سازی کرده تا قاچاق صاحب مغازه لو بره!",
            choices: [
              {
                text: "ضبط نوار و تحویل پرونده",
                action: () => {
                  this.finishCase("با ضبط نوار صوتی داخل امانت‌فروشی و ضمیمه‌کردن کارت کلید، همدستی مالک مغازه و سرقت ساختگی افشا شد. برف سرد شهر این‌بار نتوانست حقیقت را دفن کند.");
                  return null;
                }
              },
              {
                text: "تعقیب ردپا از در پشتی",
                action: () => {
                  this.finishCase("ردپای تازه در برف خروجی پشتی و رسید صندوق شماره ۷، مسیر مستقیم مخفیگاه ساعت‌ساز و مالک فراری را فاش کرد. پرونده پیش از سپیده‌دم بسته شد.");
                  return null;
                }
              }
            ]
          };
        }

        finishCase(summaryText) {
          this.state.flags.caseClosed = true;
          this.completeObjective("obj3");
          this.sound.playClueChime();
          this.closeDialogue();
          this.dom.epilogueSummary.textContent = summaryText;
          const toFa = (n) => String(n).replace(/\d/g, (d) => "۰۱۲۳۴۵۶۷۸۹"[d]);
          this.dom.epilogueClues.textContent = `مدارک جمع‌آوری‌شده: ${toFa(this.state.inventory.length)} از ${toFa(Object.keys(CLUE_META).length)}`;
          this.dom.epilogue.classList.add("show");
        }

        addClue(id) {
          if (this.state.inventory.includes(id)) return;
          this.state.inventory.push(id);
          this.sound.playClueChime();
          const meta = CLUE_META[id];
          if (meta) {
            this.showToast(`مدرک جدید ثبت شد: ${meta.label}`);
          }
          this.updateHUD();
        }

        completeObjective(key) {
          if (this.state.objectives[key]) return;
          this.state.objectives[key] = true;
          this.updateHUD();
        }

        showToast(msg) {
          this.dom.toast.textContent = msg;
          this.dom.toast.classList.add("show");
          clearTimeout(this.toastTimer);
          this.toastTimer = setTimeout(() => {
            this.dom.toast.classList.remove("show");
          }, 3000);
        }

        updateHUD() {
          this.dom.chapterLabel.textContent =
            this.state.chapter === 1 ? "فصل ۱ · کوچه برفی" : "فصل ۲ · ورودی مغازه مشکوک";

          // Objectives list
          let doneCount = 0;
          const keys = ["obj1", "obj2", "obj3"];
          let foundActive = false;
          this.dom.objItems.forEach((el, idx) => {
            const k = keys[idx];
            const isDone = this.state.objectives[k];
            if (isDone) doneCount++;
            el.classList.toggle("done", isDone);
            if (!isDone && !foundActive) {
              el.classList.add("active");
              foundActive = true;
            } else {
              el.classList.remove("active");
            }
          });
          const persianNums = ["۰", "۱", "۲", "۳"];
          this.dom.objCounter.textContent = `${persianNums[doneCount]} از ۳`;

          // Minimal Evidence Strip
          const allKeys = Object.keys(CLUE_META);
          this.dom.invSlots.innerHTML = "";
          allKeys.forEach((id, idx) => {
            const meta = CLUE_META[id];
            const collected = this.state.inventory.includes(id);
            const slot = document.createElement("div");
            slot.className = "inv-slot" + (collected ? " collected" : "");
            if (collected) {
              slot.innerHTML = `<span class="inv-icon">${meta.icon}</span><span>${meta.label}</span>`;
              slot.title = meta.desc;
              slot.addEventListener("click", () => {
                this.openDialogue({
                  speaker: `مدرک: ${meta.label}`,
                  text: meta.desc
                });
              });
            } else {
              const faIdx = ["۱", "۲", "۳", "۴", "۵"][idx];
              slot.innerHTML = `<span>${faIdx}</span>`;
              slot.title = "مدرک کشف‌نشده";
            }
            this.dom.invSlots.appendChild(slot);
          });
        }

        transitionToChapter(targetChapter, spawnX) {
          if (this.state.transitioning) return;
          this.state.transitioning = true;
          this.closeDialogue();
          this.dom.curtainText.textContent =
            targetChapter === 2 ? "فصل ۲: ورودی مغازه مشکوک" : "فصل ۱: کوچه برفی";
          this.dom.curtain.classList.add("active");

          setTimeout(() => {
            this.state.chapter = targetChapter;
            this.state.detective.x = spawnX;
            this.state.activeHotspot = null;
            this.updateHUD();
            setTimeout(() => {
              this.dom.curtain.classList.remove("active");
              this.state.transitioning = false;
              if (targetChapter === 2 && !this.state.flags.hasKeycard && !this.state.flags.doorUnlocked) {
                this.showToast("نکته: برای باز کردن در مغازه به کارت کلید کوچه نیاز دارید");
              }
            }, 240);
          }, 340);
        }

        buildSceneLightsAndOccluders(time) {
          const det = this.state.detective;
          const flashDX = Math.cos(det.aimAngle);
          const flashDY = Math.sin(det.aimAngle);

          const flashlight = {
            x: det.flashOriginX,
            y: det.flashOriginY,
            radius: 265,
            r: 1.55, g: 1.46, b: 1.24,
            dx: flashDX, dy: flashDY,
            cosOuter: Math.cos(0.42),
            cosInner: Math.cos(0.16),
            softness: 11.0,
            vol: 0.19
          };

          if (this.state.chapter === 1) {
            const flicker = 0.88 + 0.12 * Math.sin(time * 9.3) * Math.sin(time * 23.7);
            const occluders = [
              { cx: 21, cy: 132, hw: 21, hh: 90 },    // Left brick alley wall
              { cx: 244, cy: 205, hw: 16, hh: 17 },   // Wooden crate
              { cx: 290, cy: 174, hw: 28, hh: 47 },   // Metal container
              { cx: 378, cy: 206, hw: 10, hh: 16 },   // Alley trash barrel
              { cx: 449, cy: 79, hw: 31, hh: 31 }     // Overhead archway brick lintel
            ];
            const lights = [
              flashlight,
              {
                x: 205, y: 86, radius: 225,
                r: 1.42 * flicker, g: 0.84 * flicker, b: 0.30 * flicker,
                dx: 0, dy: 1,
                cosOuter: Math.cos(1.08),
                cosInner: Math.cos(0.55),
                softness: 9.0,
                vol: 0.11
              },
              {
                x: 50, y: 126, radius: 135,
                r: 0.28, g: 0.45, b: 0.82,
                dx: 1, dy: 0.35,
                cosOuter: -1.0, cosInner: -1.0,
                softness: 6.0,
                vol: 0.04
              },
              {
                x: 472, y: 164, radius: 135,
                r: 0.82, g: 0.24, b: 0.44,
                dx: -1, dy: 0,
                cosOuter: -1.0, cosInner: -1.0,
                softness: 7.0,
                vol: 0.06
              }
            ];
            return { occluders, lights, ambient: [0.12, 0.15, 0.25] };
          } else {
            const flicker = 0.88 + 0.12 * Math.sin(time * 8.1) * Math.sin(time * 19.2);
            const neonPulse = Math.sin(time * 14.0) * Math.sin(time * 37.0) > -0.82 ? 1.0 : 0.4;
            const unlocked = this.state.flags.doorUnlocked;

            const occluders = [
              { cx: 22, cy: 152, hw: 22, hh: 70 },    // Left edge wall
              { cx: 145, cy: 204, hw: 14, hh: 18 },   // Metal trash bin
              { cx: 192, cy: 174, hw: 10, hh: 48 },   // Left shop brick pier
              { cx: 290, cy: 176, hw: 14, hh: 46 },   // Pillar between window & door
              { cx: 374, cy: 176, hw: 16, hh: 46 },   // Right shop brick pier
              { cx: 438, cy: 190, hw: 14, hh: 32 }    // Utility meter box
            ];

            const lights = [
              flashlight,
              {
                x: 84, y: 86, radius: 205,
                r: 1.32 * flicker, g: 0.78 * flicker, b: 0.28 * flicker,
                dx: 0, dy: 1,
                cosOuter: Math.cos(1.05),
                cosInner: Math.cos(0.52),
                softness: 9.0,
                vol: 0.10
              },
              {
                x: 245, y: 92, radius: 195,
                r: 0.24 * neonPulse, g: 0.92 * neonPulse, b: 0.90 * neonPulse,
                dx: 0, dy: 1,
                cosOuter: Math.cos(1.25),
                cosInner: Math.cos(0.45),
                softness: 6.5,
                vol: 0.08
              },
              {
                x: 325, y: 92, radius: 185,
                r: 1.05 * neonPulse, g: 0.24 * neonPulse, b: 0.48 * neonPulse,
                dx: 0, dy: 1,
                cosOuter: Math.cos(1.25),
                cosInner: Math.cos(0.45),
                softness: 6.5,
                vol: 0.08
              },
              {
                x: 331, y: 152,
                radius: unlocked ? 205 : 95,
                r: unlocked ? 1.15 : 0.26,
                g: unlocked ? 0.68 : 0.34,
                b: unlocked ? 0.32 : 0.56,
                dx: 0, dy: 0.7,
                cosOuter: -1.0, cosInner: -1.0,
                softness: 10.0,
                vol: unlocked ? 0.14 : 0.03
              }
            ];
            return { occluders, lights, ambient: [0.11, 0.14, 0.24] };
          }
        }

        update(dt, time) {
          const det = this.state.detective;

          // 1. Typewriter progression
          if (this.dialogue.open && this.dialogue.typing) {
            this.dialogue.visibleChars += dt * 62;
            const count = Math.floor(this.dialogue.visibleChars);
            if (count >= this.dialogue.fullText.length) {
              this.finishTyping();
            } else {
              const slice = this.dialogue.fullText.slice(0, count);
              if (slice !== this.dom.dialogueText.textContent) {
                this.dom.dialogueText.textContent = slice;
                this.sound.playTypeClick();
              }
            }
          } else if (this.dialogue.open && this.dialogue.autoCloseTimer > 0 && !this.dialogue.choices) {
            this.dialogue.autoCloseTimer -= dt;
            if (this.dialogue.autoCloseTimer <= 0) {
              this.closeDialogue();
            }
          }

          // 2. Detective movement (lock movement only when awaiting a choice menu)
          const awaitingChoice = this.dialogue.open && this.dialogue.choices && this.dialogue.choices.length > 0;
          let move = 0;
          if (!this.state.transitioning && !awaitingChoice && !this.state.flags.caseClosed) {
            if (this.keys.has("KeyA") || this.keys.has("ArrowLeft")) move -= 1;
            if (this.keys.has("KeyD") || this.keys.has("ArrowRight")) move += 1;
          }

          if (move !== 0) {
            // Dismiss passive narration smoothly when player starts walking
            if (this.dialogue.open && !this.dialogue.choices && !this.dialogue.typing) {
              this.closeDialogue();
            }
            det.vx = move * 78;
            det.x += det.vx * dt;
            det.anim = "walk";
            det.walkPhase += dt * 11.5;
            det.frame = Math.floor(det.walkPhase) % 6;

            if ((det.frame === 1 || det.frame === 4) && det.frame !== det.lastStepFrame) {
              det.lastStepFrame = det.frame;
              this.sound.playSnowStep();
              this.renderer.spawnSnowKick(det.x, det.y, move);
            }
          } else {
            det.vx = 0;
            if (det.anim !== "inspect" || !this.dialogue.open) {
              det.anim = "idle";
            }
            det.lastStepFrame = -1;
          }

          // Clamp / scene boundary transitions
          if (this.state.chapter === 1) {
            if (det.x < 54) det.x = 54;
            if (det.x >= 456) {
              this.transitionToChapter(2, 38);
            }
          } else {            if (det.x <= 22) {
              this.transitionToChapter(1, 438);
            }
            if (det.x > 412) det.x = 412;
          }

          // 3. Aim flashlight smoothly toward mouse cursor
          const shoulderX = det.x + det.facing * 2;
          const shoulderY = det.y - 19;
          const aimDX = this.mouseWorld.x - shoulderX;
          const aimDY = this.mouseWorld.y - shoulderY;
          det.aimAngle = Math.atan2(aimDY, aimDX);
          if (Math.abs(aimDX) > 6) {
            det.facing = aimDX >= 0 ? 1 : -1;
          }

          // Cat perks up if detective gets close or shines flashlight at it in Ch1
          if (this.state.chapter === 1) {
            const catX = this.state.flags.catChecked ? 302 : 284;
            const distCat = Math.hypot(det.x - catX, det.y - 125);
            const dxFlash = catX - det.flashOriginX;
            const dyFlash = 118 - det.flashOriginY;
            const dFlash = Math.hypot(dxFlash, dyFlash);
            const dotFlash = (dxFlash * Math.cos(det.aimAngle) + dyFlash * Math.sin(det.aimAngle)) / Math.max(1, dFlash);
            this.state.catAlert = distCat < 128 || (dFlash < 220 && dotFlash > 0.9);
            this.state.catChecked = this.state.flags.catChecked;
          }

          // 4. Hotspot proximity detection & floating world prompt
          const hotspots = getChapterHotspots(this.state.chapter, this.state.flags);
          let best = null;
          let bestDist = Infinity;
          for (const h of hotspots) {
            const d = Math.abs(det.x - h.x);
            if (d <= h.range && d < bestDist) {
              best = h;
              bestDist = d;
            }
          }
          this.state.activeHotspot = best;
          this.updateWorldPrompt(best);
          this.updateThoughtBubblePosition();

          // 5. Particles
          this.renderer.updateParticles(dt, det, time);
        }

        updateWorldPrompt(hotspot) {
          if (this.dialogue.open || this.state.transitioning || this.state.flags.caseClosed) {
            if (this.dom.prompts.firstChild) this.dom.prompts.innerHTML = "";
            return;
          }

          let target = hotspot;
          let isExitCue = false;
          if (!target) {
            const dx = this.state.detective.x;
            if (this.state.chapter === 1 && dx >= 385) {
              target = { id: "exit_ch2", x: 438, y: 162, h: 36, label: "ورود به خیابان مغازه" };
              isExitCue = true;
            } else if (this.state.chapter === 2 && dx <= 62) {
              target = { id: "exit_ch1", x: 42, y: 162, h: 36, label: "بازگشت به کوچه برفی" };
              isExitCue = true;
            }
          }

          if (!target) {
            if (this.dom.prompts.firstChild) this.dom.prompts.innerHTML = "";
            return;
          }

          const leftPct = (target.x / WORLD_W) * 100;
          const topPct = (Math.max(26, target.y - target.h * 0.5 - 6) / WORLD_H) * 100;

          let pill = this.dom.prompts.firstElementChild;
          if (!pill) {
            pill = document.createElement("div");
            pill.className = "world-prompt";
            this.dom.prompts.appendChild(pill);
          }
          pill.style.left = `${leftPct.toFixed(2)}%`;
          pill.style.top = `${topPct.toFixed(2)}%`;
          const keyAttr = target.id;
          if (pill.dataset.hid !== keyAttr) {
            pill.dataset.hid = keyAttr;
            if (isExitCue) {
              const keyTxt = target.id === "exit_ch2" ? "D" : "A";
              pill.innerHTML = `<span class="key-badge">${keyTxt}</span><span>${target.label}</span>`;
            } else {
              pill.innerHTML = `<span class="key-badge">E</span><span>بررسی: ${target.label}</span>`;
            }
          }
        }

        loop(now) {
          const dt = Math.min(0.05, Math.max(0.001, (now - this.lastTime) / 1000));
          this.lastTime = now;
          this.elapsed += dt;

          this.update(dt, this.elapsed);

          const { occluders, lights, ambient } = this.buildSceneLightsAndOccluders(this.elapsed);
          this.renderer.renderScene(this.state, this.elapsed, lights);
          this.lighting.render(
            this.renderer.sceneCanvas,
            this.renderer.emissiveCanvas,
            occluders,
            lights,
            ambient,
            this.elapsed
          );

          requestAnimationFrame((t) => this.loop(t));
        }
      }

      // Immediate boot on load — zero blank screens
      window.addEventListener("DOMContentLoaded", () => {
        window.__SHADOW_SECRETS__ = new MysteryGame();
      });
    })();
  </script>
